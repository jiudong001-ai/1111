<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>每日灵性卡制作台</title><style>body{margin:0;background:#f9f3ea;color:#413047;font:16px/1.6 Arial,sans-serif}.shell{max-width:1200px;margin:auto;padding:30px}h1{font-size:30px}button,.download{background:#413047;color:white;border:0;border-radius:8px;padding:12px 18px;cursor:pointer;margin:6px 6px 6px 0;display:inline-block;text-decoration:none}button.secondary{background:#eadbdc;color:#413047}input,textarea{box-sizing:border-box;width:100%;padding:10px;border:1px solid #c9b7c9;border-radius:6px;font:16px/1.5 Arial}textarea{min-height:90px}label{display:block;margin-top:12px}.toolbar{display:flex;gap:18px;align-items:end;flex-wrap:wrap}.toolbar input{width:180px}.layout{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:25px}.panel{background:#fffaf4;border:1px solid #dfcbaa;border-radius:18px;padding:24px}.preview{width:100%;height:780px;border:0;background:white}.day{margin-top:28px}.status{background:#eee4df;padding:15px;border-radius:8px}small{color:#75677a}.files a{display:block}.download{font-size:15px}@media(max-width:800px){.layout{grid-template-columns:1fr}.preview{height:660px}}button:disabled{opacity:.5}</style>
<main class="shell"><a href="/">← 返回占星工作台</a><h1>每日灵性卡制作台</h1><p>7天独立主题与插画。英文卡片不显示任何员工名字、Logo 或水印。文案为一般反思，独立于个人星盘计算。</p><div class="toolbar"><label>起始日期<input type="date" id="date"></label><div><button id="today">生成今天预览</button><button class="secondary" id="week">预览未来7天</button><button id="export-all">一键导出当前全部 PNG</button></div></div><p class="status" id="status" role="status">先生成预览。可以编辑英文，再导出 Feed 与 Story 两种尺寸。</p><small>重新生成会轮换3组人工编写文案，轮换库用完会循环；可继续人工编辑。AI 按钮调用 DeepSeek 生成新文案，试用默认每天最多20次；背景与配色保持固定。编辑内容需符合字数要求。</small><div id="days"></div><div id="files" class="files"></div></main><style>.card-gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:24px;margin-top:24px}.card-preview{margin:0;padding:16px;background:#fffaf4;border:1px solid #e3d7c5;border-radius:12px;min-width:0}.card-preview h3{margin:0 0 12px;font-size:18px}.card-preview img{display:block;width:100%;height:auto;border-radius:6px}.card-preview a{display:inline-block;margin:12px 12px 0 0}.card-preview details{margin-top:16px}.card-preview summary{cursor:pointer}#preview.card-gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}@media(max-width:600px){.card-gallery,#preview.card-gallery{grid-template-columns:1fr}}</style><script>
function inlineCards(files){
 const cards=(files||[]).filter(f=>/(?:-card|-feed)\.png$/.test(f));
 return cards.map(f=>{const name=f.split('/').pop(),daily=name.endsWith('-feed.png')||name==='daily-card.png',title=name==='love-card.png'?'爱情解读卡':daily?'每日灵性卡'+(name.endsWith('-feed.png')?' · '+name.slice(0,10):''):'解读卡',story=name.endsWith('-feed.png')?files.find(x=>x===f.replace('-feed.png','-story.png')):null;
 return `<figure class="card-preview"><h3>${esc(title)}</h3><a href="${esc(f)}" target="_blank" rel="noopener" aria-label="查看${esc(title)}大图"><img src="${esc(f)}" alt="${esc(title)}" loading="lazy"></a><div><a href="${esc(f)}" target="_blank" rel="noopener">查看大图</a><a href="${esc(f)}" download>下载图片</a></div>${story?`<details><summary>查看 Story 长图</summary><a href="${esc(story)}" target="_blank" rel="noopener"><img src="${esc(story)}" alt="${esc(title)} Story 长图" loading="lazy"></a><a href="${esc(story)}" download>下载 Story 图片</a></details>`:''}</figure>`;
 }).join('');
}
</script><script>
const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let drafts=[];let previewTimer;
const fields=[['headline','独立副标题（最多10词）'],['message','今日寄语（15–30词）'],['love','关系指引（8–18词）'],['lucky_color','幸运色（需与穿搭建议一致）'],['lucky_number','趣味幸运数字（1–9）'],['style','穿搭建议（6–15词）'],['affirmation','肯定语（最多16词）']];
async function api(path,data){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const d=await r.json();if(!r.ok)throw Error(typeof d.detail==='string'?d.detail:JSON.stringify(d.detail));return d}
function status(s){$('#status').textContent=s}function busy(b){document.querySelectorAll('button').forEach(x=>x.disabled=b)}
function render(){ $('#days').innerHTML=drafts.map((d,i)=>`<section class="day"><h2>${esc(d.date)} · ${esc(d.theme)}</h2><div class="layout"><div class="panel">${fields.map(([k,l])=>`<label>${l}<${['message','love','style','affirmation'].includes(k)?'textarea':'input'} data-i="${i}" data-k="${k}" ${k==='lucky_number'?'type="number" min="1" max="9"':''} ${['message','love','style','affirmation'].includes(k)?'':'value="'+esc(d[k])+'"'}>${['message','love','style','affirmation'].includes(k)?esc(d[k])+'</textarea>':''}</label>`).join('')}<button data-regenerate="${i}" class="secondary">重新生成这一天</button><button data-ai="${i}" class="secondary">AI 生成新文案（DeepSeek）</button><button data-export="${i}">导出这一天 PNG</button></div><iframe class="preview" title="${esc(d.date)} 英文卡片预览" sandbox="" id="frame-${i}"></iframe></div></section>`).join('');document.querySelectorAll('[data-k]').forEach(e=>e.oninput=()=>{drafts[+e.dataset.i][e.dataset.k]=e.dataset.k==='lucky_number'?+e.value:e.value;clearTimeout(previewTimer);previewTimer=setTimeout(()=>preview(+e.dataset.i),450)});document.querySelectorAll('[data-regenerate]').forEach(e=>e.onclick=()=>regenerate(+e.dataset.regenerate));document.querySelectorAll('[data-export]').forEach(e=>e.onclick=()=>exportCards([drafts[+e.dataset.export]]));document.querySelectorAll('[data-ai]').forEach(e=>e.onclick=()=>generateAI(+e.dataset.ai));drafts.forEach((d,i)=>preview(i));}
async function preview(i){try{const d=await api('/api/daily/preview',{draft:drafts[i]});const frame=$('#frame-'+i),scale=frame.clientWidth/1080;frame.style.height=(1350*scale+4)+'px';frame.srcdoc=d.html+'<style>.card{transform:scale('+scale+');transform-origin:top left}html,body{overflow:hidden}</style>';status('预览已更新。请检查英文和画面后导出。')}catch(e){status(e.message)}}
async function load(count,today=false){busy(true);try{const d=await api('/api/daily/drafts',{start:today?null:$('#date').value,count});drafts=d.drafts;$('#date').value=drafts[0].date;render()}catch(e){status(e.message)}finally{busy(false)}}
async function regenerate(i){busy(true);try{const d=await api('/api/daily/drafts',{start:drafts[i].date,count:1,revision:drafts[i].revision+1});drafts[i]=d.drafts[0];render()}catch(e){status(e.message)}finally{busy(false)}}
async function generateAI(i){busy(true);status('DeepSeek 正在生成新文案，请稍候…');try{const r=await api('/api/daily/ai',{day:drafts[i].date,revision:drafts[i].revision+1});drafts[i]=r.draft;render();status('AI 文案已填入，请审核后导出。今日剩余 '+r.remaining+' 次。')}catch(e){status(e.message)}finally{busy(false)}}
async function exportCards(ds){if(!ds.length){status('请先生成预览。');return}busy(true);status('正在排版并检查文字溢出，请稍候…');try{const d=await api('/api/daily/export',{drafts:ds});$('#files').innerHTML='<h2>已生成的卡片</h2><a class="download" href="'+esc(d.bundle)+'" download>下载整套 ZIP</a><div class="card-gallery">'+inlineCards(d.files)+'</div>';status('导出完成：1080 × 1350 与 1080 × 1920，自动溢出检查通过。')}catch(e){status(e.message)}finally{busy(false)}}
$('#today').onclick=()=>load(1,true);$('#week').onclick=()=>load(7);$('#export-all').onclick=()=>exportCards(drafts);$('#date').value=new Intl.DateTimeFormat('en-CA',{timeZone:'America/New_York',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
</script></html>
