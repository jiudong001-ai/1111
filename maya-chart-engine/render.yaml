services:
  - type: web
    name: maya-chart-engine
    runtime: python
    plan: free
    rootDir: maya-chart-engine
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT --no-access-log
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
